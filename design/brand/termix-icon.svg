<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景渐变：左上亮、右下暗的深色金属质感，营造终端工作台面的深邃感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3137"/>
      <stop offset="55%" stop-color="#1B1D21"/>
      <stop offset="100%" stop-color="#0F1013"/>
    </linearGradient>
    <!-- 顶部玻璃高光：现代 Big Sur 风格 -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 符号辉光：让绿色提示符在深色背景上柔和发光 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bodyClip">
      <rect x="40" y="40" width="944" height="944" rx="228"/>
    </clipPath>
  </defs>

  <!-- 主体：深色圆角方块 -->
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#bgGrad)"/>
  <!-- 边缘描边：增强轮廓 -->
  <rect x="40" y="40" width="944" height="944" rx="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- 顶部玻璃高光 -->
  <g clip-path="url(#bodyClip)">
    <rect x="40" y="40" width="944" height="420" fill="url(#glass)"/>
  </g>

  <!-- 底部弱反光 -->
  <g clip-path="url(#bodyClip)">
    <rect x="40" y="820" width="944" height="164" fill="#000000" opacity="0.18"/>
  </g>

  <!-- 终端提示符 `>` + 光标 `_`：品牌绿 -->
  <g stroke="#32F08C" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" opacity="0.55">
    <path d="M 276 344 L 402 512 L 276 680"/>
    <path d="M 468 680 H 748"/>
  </g>
  <g stroke="#32F08C" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 276 344 L 402 512 L 276 680"/>
    <path d="M 468 680 H 748"/>
  </g>
</svg>
