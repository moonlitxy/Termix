[package]
name = "termix"
version = "1.0.1"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
ring = "0.17"
russh-sftp = "2.3"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "p256", "p384", "p521", "encryption", "ppk", "sha1"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "io-util", "net", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
# 软件更新检查/下载：rustls-tls 避免依赖系统 OpenSSL，stream 用于流式下载
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[features]
# this feature is used for production builds where `devUrl` is not used
custom-protocol = ["tauri/custom-protocol"]
