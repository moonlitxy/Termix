name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发版闸门：只有指向 main 提交的 tag 才产出安装包。
  # dev 上打 tag 允许存在，workflow 正常结束（绿色），但所有构建 job 被跳过。
  guard:
    name: Resolve release eligibility
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Check tag commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME is on main — build enabled."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $GITHUB_REF_NAME is not on main — skipping release build (dev tags are allowed)."
          fi

  # macOS：构建 DMG 安装包
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: guard
    if: needs.guard.outputs.on_main == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # 只有 secrets 非空时才导出签名变量。
      # 注意：不能把空的 APPLE_CERTIFICATE 放进 env——Tauri 会把它当成“要导入证书”，
      # 进而执行 security import 并失败（未配置签名时发版失败的根因）。
      - id: signing
        name: Configure Apple signing (optional)
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PWD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          add() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          }
          add APPLE_CERTIFICATE "$CERT_B64"
          add APPLE_CERTIFICATE_PASSWORD "$CERT_PWD"
          add APPLE_SIGNING_IDENTITY "$SIGN_ID"
          add APPLE_ID "$APPLE_ID_S"
          add APPLE_PASSWORD "$APPLE_PWD"
          add APPLE_TEAM_ID "$TEAM"
          if [ -n "$SIGN_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signed build enabled ($SIGN_ID)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building unsigned installer"
          fi

      # secrets 齐全时 Tauri 自动签名 + 公证；缺失时构建未签名包，不阻断发版
      - name: Build DMG
        run: npm run tauri build -- --bundles dmg

      # 配置了签名身份时，验证 DMG 已装订公证票据（失败即发版失败，避免静默发出未公证包）
      - name: Verify notarization ticket
        if: steps.signing.outputs.signed == 'true'
        run: |
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          echo "verifying $DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows：构建 NSIS 安装包（exe）
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: guard
    if: needs.guard.outputs.on_main == 'true'
    # 同上：secrets 先映射到 env，step 级 if 才可用
    env:
      WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # lock 由 macOS 生成，仅含 darwin 平台的可选二进制。npm ci 严格按 lock
      # 安装，不含 win32 平台包（tauri CLI / rollup / esbuild 等）。此处忽略
      # lock 按 package.json 重新解析当前平台，补齐所有 win32 可选包
      - name: Install Windows platform binaries
        run: npm install --no-save --package-lock=false

      - name: Build EXE
        run: npm run tauri build -- --bundles nsis

      # Windows 代码签名（Authenticode，可选）：
      # 有 EV/OV 证书时设置 WINDOWS_CERTIFICATE（base64 pfx）+ WINDOWS_CERTIFICATE_PASSWORD，
      # 无证书则跳过（SmartScreen 会提示未知发布者，不影响安装）。
      - name: Sign Windows installer (optional)
        if: env.WINDOWS_CERTIFICATE_B64 != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\termix-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found; cannot sign' }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.Name)" }
          }
          Remove-Item $pfx -Force

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 源码包：生成 tag 对应代码的 tar.gz 压缩包
  build-source:
    name: Package Source Code
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.on_main == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=termix-${GITHUB_REF_NAME}/ -o termix-${GITHUB_REF_NAME}-source.tar.gz HEAD
          echo "ARCHIVE=termix-${GITHUB_REF_NAME}-source.tar.gz" >> "$GITHUB_ENV"

      - name: Upload Source to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
