name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS：构建 DMG 安装包
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    # secrets 上下文不能用在 if 表达式里，先映射到 env 再判断；
    # Tauri CLI 会自动导入 APPLE_CERTIFICATE 并完成签名 + 公证 + 装订。
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # secrets 齐全时 Tauri 自动签名 + 公证；缺失时构建未签名包，不阻断发版
      - name: Build DMG
        run: npm run tauri build -- --bundles dmg

      # 配置了签名身份时，验证 DMG 已装订公证票据（失败即发版失败，避免静默发出未公证包）
      - name: Verify notarization ticket
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          echo "verifying $DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows：构建 NSIS 安装包（exe）
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    # 同上：secrets 先映射到 env，step 级 if 才可用
    env:
      WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # lock 由 macOS 生成，仅含 darwin 平台的可选二进制。npm ci 严格按 lock
      # 安装，不含 win32 平台包（tauri CLI / rollup / esbuild 等）。此处忽略
      # lock 按 package.json 重新解析当前平台，补齐所有 win32 可选包
      - name: Install Windows platform binaries
        run: npm install --no-save --package-lock=false

      - name: Build EXE
        run: npm run tauri build -- --bundles nsis

      # Windows 代码签名（Authenticode，可选）：
      # 有 EV/OV 证书时设置 WINDOWS_CERTIFICATE（base64 pfx）+ WINDOWS_CERTIFICATE_PASSWORD，
      # 无证书则跳过（SmartScreen 会提示未知发布者，不影响安装）。
      - name: Sign Windows installer (optional)
        if: env.WINDOWS_CERTIFICATE_B64 != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\termix-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found; cannot sign' }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.Name)" }
          }
          Remove-Item $pfx -Force

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 源码包：生成 tag 对应代码的 tar.gz 压缩包
  build-source:
    name: Package Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=termix-${GITHUB_REF_NAME}/ -o termix-${GITHUB_REF_NAME}-source.tar.gz HEAD
          echo "ARCHIVE=termix-${GITHUB_REF_NAME}-source.tar.gz" >> "$GITHUB_ENV"

      - name: Upload Source to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
