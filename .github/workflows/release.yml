name: Release

on:
  push:
    tags:
      - "v1.0.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS：构建 DMG 安装包
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: Build DMG
        run: npm run tauri build -- --bundles dmg

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows：构建 NSIS 安装包（exe）
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: Build EXE
        run: npm run tauri build -- --bundles nsis

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 源码包：生成 tag 对应代码的 tar.gz 压缩包
  build-source:
    name: Package Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=termix-${GITHUB_REF_NAME}/ -o termix-${GITHUB_REF_NAME}-source.tar.gz HEAD
          echo "ARCHIVE=termix-${GITHUB_REF_NAME}-source.tar.gz" >> "$GITHUB_ENV"

      - name: Upload Source to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
